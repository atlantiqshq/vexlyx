name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `prisma generate` only needs a syntactically valid URL, it never connects.
  DATABASE_URL: postgresql://vexlyx:placeholder@localhost:5432/vexlyx_dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vexlyx/api db:generate
      # turbo builds @vexlyx/shared first (typecheck dependsOn ^build).
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vexlyx/api db:generate
      - run: pnpm test

  build-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: system/python/requirements-build.txt
      - run: python -m pip install -r system/python/requirements-build.txt
      - name: Install pinned Nixpacks integration-test engine
        run: |
          curl -fsSL https://github.com/railwayapp/nixpacks/releases/download/v1.41.0/nixpacks-v1.41.0-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/nixpacks.tar.gz"
          echo "0f55de7874507b9cf7502113120bd96f2ab6979f78d10eaf2eb2ade9207b3af6  $RUNNER_TEMP/nixpacks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/nixpacks.tar.gz" -C "$RUNNER_TEMP" nixpacks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s system/python -p 'test_build_preflight.py' -v
        env:
          NIXPACKS_INTEGRATION: '1'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: apps/dashboard/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/dashboard/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vexlyx/api db:generate
      - run: pnpm build
